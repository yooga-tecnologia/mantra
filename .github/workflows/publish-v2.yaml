name: Publish v2 and Deploy GitHub Pages

on:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ler versão do Node do .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc | sed 's/^v//')" >> $GITHUB_ENV

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: https://npm.pkg.github.com/
          scope: '@yooga-tecnologia'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-v2-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-v2-

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Build do Storybook
        run: npm run build-storybook

      - name: Montar diretório do site
        run: |
          rm -rf ./_site
          cp -r ./storybook-static ./_site
          mkdir -p ./_site/storybook-static
          cat > ./_site/storybook-static/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-br">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=/mantra/" />
              <link rel="canonical" href="/mantra/" />
              <title>Mantra</title>
            </head>
            <body>
              <p>O Storybook agora está em <a href="/mantra/">/mantra/</a>.</p>
            </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Publicar no GitHub Packages
        run: npm publish --tag legacy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
