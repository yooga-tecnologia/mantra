name: Publish v2 to GitHub Packages

on:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ler versão do Node do .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc | sed 's/^v//')" >> $GITHUB_ENV

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: https://npm.pkg.github.com/
          scope: '@yooga-tecnologia'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-v2-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-v2-

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publicar no GitHub Packages
        run: npm publish --tag legacy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
