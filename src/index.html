<!DOCTYPE html>
<html dir="ltr" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Mantra - Sandbox · Editar Cupom</title>

  <script type="module" src="/build/mantra.esm.js"></script>
  <script nomodule src="/build/mantra.js"></script>
  <link rel="stylesheet" href="/build/mantra.css" />
</head>

<body>
  <div class="page">

    <mnt-options-list
      full-width
      name="estado-1"
      placeholder="Selecione um estado"
      items='[{"es":"Espírito Santo"},{"sp":"São Paulo"},{"rj":"Rio de Janeiro"},{"mg":"Minas Gerais"},{"ba":"Bahia"},{"pe":"Pernambuco"},{"al":"Alagoas"},{"se":"Sergipe"},{"to":"Tocantins"},{"am":"Amazonas"},{"ac":"Acre"},{"rr":"Roraima"},{"pa":"Pará"},{"ap":"Amapá"},{"ro":"Rondônia"},{"ms":"Mato Grosso do Sul"},{"mt":"Mato Grosso"},{"go":"Goiás"},{"df":"Distrito Federal"}]'
    ></mnt-options-list>

    <mnt-options-list

      name="estado-2"
      placeholder="Selecione um estado"
      items='[{"es":"Espírito Santo"},{"sp":"São Paulo"},{"rj":"Rio de Janeiro"},{"mg":"Minas Gerais"},{"ba":"Bahia"},{"pe":"Pernambuco"},{"al":"Alagoas"},{"se":"Sergipe"},{"to":"Tocantins"},{"am":"Amazonas"},{"ac":"Acre"},{"rr":"Roraima"},{"pa":"Pará"},{"ap":"Amapá"},{"ro":"Rondônia"},{"ms":"Mato Grosso do Sul"},{"mt":"Mato Grosso"},{"go":"Goiás"},{"df":"Distrito Federal"}]'
    ></mnt-options-list>
  </div>

  <script>
    document.addEventListener('tagRemoved', function (event) {
      var id = event.detail.id;
      var tag = document.querySelector('mnt-tag-removable[id="' + id + '"]');
      if (tag) tag.remove();
    });
  </script>
</body>
</html>
