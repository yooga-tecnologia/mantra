<!DOCTYPE html>
<html dir="ltr" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Mantra - Sandbox · Editar Cupom</title>

  <script type="module" src="/build/mantra.esm.js"></script>
  <script nomodule src="/build/mantra.js"></script>
  <link rel="stylesheet" href="/build/mantra.css" />
</head>

<body>
  <div class="page">
    <mnt-field-text input-name="teste" label-text="Teste" placeholder="Teste" disabled id="field-text"></mnt-field-text>
    <mnt-button variant="emphasis" label="Habilitar" color="primary" size="tiny" id="enable-field-text"></mnt-button>

    <script>
      const fieldText = document.getElementById('field-text');
      const enableFieldText = document.getElementById('enable-field-text');

      enableFieldText.addEventListener('click', () => {
        fieldText.disabled = !fieldText.disabled;
      });
    </script>
  </div>
</body>
</html>
