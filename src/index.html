      </div>

      <!-- type: steps -->
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <p style="margin: 0; font-family: sans-serif; font-size: 12px; color: #818A8F;">type: steps</p>
        <mnt-progress-bar id="steps-bar" type="steps" label="Etapa 1 de 4" color="primary" full-width></mnt-progress-bar>
        <div style="display: flex; gap: 8px;">
          <button onclick="updateStep(-1)" style="padding: 6px 12px; cursor: pointer;">← Anterior</button>
          <button onclick="updateStep(1)" style="padding: 6px 12px; cursor: pointer;">Próximo →</button>
        </div>
      </div>

      <!-- rounded -->

        <mnt-progress-bar type="percent" value="60" label="60% — arredondado" color="primary" full-width rounded></mnt-progress-bar>

      <!-- label-position: below -->

      <!-- cores -->

        <mnt-progress-bar type="percent" value="50" label="success" color="success" full-width></mnt-progress-bar>

        <mnt-progress-bar type="percent" value="50" label="critical" color="critical" full-width></mnt-progress-bar>

      <!-- inline (sem full-width) -->

        <p style="margin: 0; font-family: sans-serif; font-size: 12px; color: #818A8F;">inline (sem full-width)</p>

      <!-- label-position: left e right -->

        <p style="margin: 0; font-family: sans-serif; font-size: 12px; color: #818A8F;">label-position: left / right (label compacto)</p>
        <mnt-progress-bar type="steps" label="Etapa 1 de 4" label-position="left" color="primary" full-width></mnt-progress-bar>
        <mnt-progress-bar type="steps" label="Etapa 3 de 5" label-position="right" color="secondary" full-width></mnt-progress-bar>

      </div>

      <!-- alteração programática de percent -->

        <mnt-progress-bar id="dynamic-bar" type="percent" value="0" label="0%" color="primary" full-width rounded></mnt-progress-bar>
        <div style="display: flex; gap: 8px;">

        </div>
      </div>
    </div>

  <script>
    // Setar value nos exemplos de label left/right (steps)
    document.querySelectorAll('mnt-progress-bar[label-position="left"][type="steps"], mnt-progress-bar[label-position="right"][type="steps"]').forEach(function (el) {
      var label = el.getAttribute('label') || '';
      var match = label.match(/(\d+)\s+de\s+(\d+)/);
      if (match) el.value = [parseInt(match[1]), parseInt(match[2])];
    });

    // Steps bar: controle de etapa atual
    var currentStep = 1;
    var totalSteps = 4;

    var stepsBar = document.getElementById('steps-bar');
    if (stepsBar) stepsBar.value = [currentStep, totalSteps];

    function updateStep(delta) {
      currentStep = Math.min(Math.max(currentStep + delta, 1), totalSteps);
      var bar = document.getElementById('steps-bar');
      if (!bar) return;
      bar.value = [currentStep, totalSteps];
      bar.label = 'Etapa ' + currentStep + ' de ' + totalSteps;
    }

    // Alteração programática de percent
    function changePercent(value) {
      var bar = document.getElementById('dynamic-bar');
      if (!bar) return;
      bar.value = value;
      bar.label = value + '%';
    }

    document.querySelectorAll('mnt-dropdown-menu').forEach(function (el) {
      el.addEventListener('menuSelect', function (event) {
        console.log('[mnt-dropdown-menu] menuSelect:', event.detail);
      });
    });

    // KDS menu: atualiza selected-value e o label do trigger ao selecionar
    (function () {
      var kdsMenu = document.getElementById('kds-menu');
      var kdsLabel = document.getElementById('kds-label');
      if (!kdsMenu || !kdsLabel) return;
      kdsMenu.addEventListener('menuSelect', function (event) {
        kdsMenu.setAttribute('selected-value', event.detail.value);
        kdsLabel.textContent = event.detail.label;
      });
    })();

    document.addEventListener('tagRemoved', function (event) {
      var id = event.detail.id;
      var tag = document.querySelector('mnt-tag-removable[id="' + id + '"]');
      if (tag) tag.remove();
    });
  </script>
