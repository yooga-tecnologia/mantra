<!DOCTYPE html>
<html dir="ltr" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <title>Mantra - Sandbox · Editar Cupom</title>

  <script type="module" src="/build/mantra.esm.js"></script>
  <script nomodule src="/build/mantra.js"></script>
  <link rel="stylesheet" href="/build/mantra.css" />
</head>

<body>
  <div class="page">
    <!-- ── Exemplo 1: seleção inicial via selected-id ────────────────────── -->
    <mnt-tag-selectable-group
      id="demo-preselected"
      tags='[{"id":"pedidos","label":"Pedidos"},{"id":"finalizados","label":"Finalizados"},{"id":"cancelados","label":"Cancelados"}]'
      selected-id="finalizados"
      full-width
    ></mnt-tag-selectable-group>

    <!-- ── Exemplo 2: conteúdo alternado de acordo com a tag selecionada ── -->
    <mnt-tag-selectable-group
      id="demo-content"
      tags='[{"id":"pedidos","label":"Pedidos"},{"id":"finalizados","label":"Finalizados"},{"id":"cancelados","label":"Cancelados"}]'
      selected-id="pedidos"
    ></mnt-tag-selectable-group>
    <div id="demo-content-panel" style="margin-top:8px;padding:12px;border:1px solid #e5e7e8;border-radius:8px;font-size:14px;">
      Conteúdo de <strong>Pedidos</strong>
    </div>

    <!-- ── Exemplo 3: label atualizado programaticamente (simula polling) ─ -->
    <mnt-tag-selectable-group
      id="demo-dynamic"
      tags='[{"id":"pedidos","label":"Pedidos (...)"},{"id":"finalizados","label":"Finalizados (...)"},{"id":"cancelados","label":"Cancelados (...)"}]'
    ></mnt-tag-selectable-group>
    <p style="font-size:12px;color:#818a8f;margin:4px 0 0;">Labels atualizam a cada 5 s simulando um polling.</p>

    <script>
      (function () {
        // ── Exemplo 2: conteúdo alternado ──────────────────────────────────
        var contentGroup = document.getElementById('demo-content');
        var panel = document.getElementById('demo-content-panel');
        var contentMap = {
          pedidos: 'Conteúdo de <strong>Pedidos</strong>',
          finalizados: 'Conteúdo de <strong>Finalizados</strong>',
          cancelados: 'Conteúdo de <strong>Cancelados</strong>',
        };
        if (contentGroup && panel) {
          contentGroup.addEventListener('selectedChange', function (e) {
            var id = e.detail.selectedId;
            if (id && contentMap[id]) panel.innerHTML = contentMap[id];
          });
        }

        // ── Exemplo 3: atualização programática dos labels ─────────────────
        var dynamicGroup = document.getElementById('demo-dynamic');
        function fetchCounts() {
          // ponytail: simula dados vindos de um polling real
          return {
            pedidos: Math.floor(Math.random() * 50) + 1,
            finalizados: Math.floor(Math.random() * 200) + 50,
            cancelados: Math.floor(Math.random() * 20),
          };
        }
        function updateDynamicLabels() {
          if (!dynamicGroup) return;
          var counts = fetchCounts();
          dynamicGroup.setAttribute('tags', JSON.stringify([
            { id: 'pedidos', label: 'Pedidos (' + counts.pedidos + ')' },
            { id: 'finalizados', label: 'Finalizados (' + counts.finalizados + ')' },
            { id: 'cancelados', label: 'Cancelados (' + counts.cancelados + ')' },
          ]));
        }
        updateDynamicLabels();
        setInterval(updateDynamicLabels, 5000);
      })();
    </script>

    <mnt-tag-selectable-group
      size="tiny"
      tags='[{"id":"1","label":"Tag 1","icon":"tag"},{"id":"2","label":"Tag 2","icon":"tag"},{"id":"3","label":"Tag 3","icon":"tag"}]'
    ></mnt-tag-selectable-group>
    <mnt-tag-selectable-group
      size="small"
      tags='[{"id":"1","label":"Tag 1","icon":"tag"},{"id":"2","label":"Tag 2","icon":"tag"},{"id":"3","label":"Tag 3","icon":"tag"}]'
    ></mnt-tag-selectable-group>
    <mnt-tag-selectable-group
      size="medium"
      tags='[{"id":"1","label":"Tag 1","icon":"tag"},{"id":"2","label":"Tag 2","icon":"tag"},{"id":"3","label":"Tag 3","icon":"tag"}]'
    ></mnt-tag-selectable-group>
    <mnt-tag-selectable-group
      size="large"
      tags='[{"id":"1","label":"Tag 1","icon":"tag"},{"id":"2","label":"Tag 2","icon":"tag"},{"id":"3","label":"Tag 3","icon":"tag"}]'
    ></mnt-tag-selectable-group>
  </div>
</body>
</html>
